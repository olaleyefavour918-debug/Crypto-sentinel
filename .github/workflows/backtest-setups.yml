# AUDIT BRANCH VERSION (not on main). Read-only diagnosis of the signal engine on real market data.
# Places no orders, touches no database, sends no email.
name: backtest-setups
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to replay (after a 40-day warm-up)"
        default: "150"
      symbols:
        description: "Comma-separated USDT pairs (BTCUSDT must be included)"
        default: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,ADAUSDT,LINKUSDT"
      source:
        description: "unused on this branch (audit runs Binance and Bybit)"
        default: "auto"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Pre-registered research (real Bybit spot data)
        id: research
        continue-on-error: true
        run: mkdir -p audit-out && npx tsx --tsconfig tests/tsconfig.json scripts/audit/research.ts --days 700 --recent 150 --symbols "${{ inputs.symbols }}" | tee audit-out/research.md
      - name: Outcome
        if: always()
        run: |
          echo "research step: ${{ steps.research.outcome }}"
          
          ls -la audit-out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-audit
          path: audit-out
          if-no-files-found: ignore
