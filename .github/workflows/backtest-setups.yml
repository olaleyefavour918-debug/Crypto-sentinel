# AUDIT BRANCH VERSION (not on main). Read-only diagnosis of the signal engine on real market data.
# Places no orders, touches no database, sends no email.
name: backtest-setups
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to replay (after a 40-day warm-up)"
        default: "150"
      symbols:
        description: "Comma-separated USDT pairs (BTCUSDT must be included)"
        default: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,ADAUSDT,LINKUSDT"
      source:
        description: "unused on this branch (audit runs Binance and Bybit)"
        default: "auto"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compare Binance and real Bybit candles and signals (all coins)
        id: compare
        continue-on-error: true
        run: mkdir -p audit-out && npx tsx --tsconfig tests/tsconfig.json scripts/audit/compare-sources.ts --days "${{ inputs.days }}" --symbols "${{ inputs.symbols }}" | tee audit-out/compare-sources.md
      - name: Post-fix audit on REAL Bybit spot data (differential vs the pre-fix audit)
        id: bybit
        continue-on-error: true
        run: mkdir -p audit-out && npx tsx --tsconfig tests/tsconfig.json scripts/audit/run.ts --source bybit-trades --days "${{ inputs.days }}" --symbols "${{ inputs.symbols }}" --out audit-out
      - name: Faithful back-test section (synthetic code check only)
        id: bt
        continue-on-error: true
        run: npx tsx --tsconfig tests/tsconfig.json scripts/backtest-setups.ts --synthetic --days 60 --symbols BTCUSDT,ETHUSDT --out audit-out/bt-synthetic | tail -20
      - name: Outcome
        if: always()
        run: |
          echo "compare step: ${{ steps.compare.outcome }}"
          echo "post-fix bybit audit: ${{ steps.bybit.outcome }}"
          echo "back-test script: ${{ steps.bt.outcome }}"
          
          ls -la audit-out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-audit
          path: audit-out
          if-no-files-found: ignore
